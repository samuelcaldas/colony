<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Colony Voxel Jam</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/*TAILWIND*/
html,body{margin:0;height:100%;background:#12261f;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.cvj-frame{width:min(100vw,calc(100dvh*9/16));height:100dvh;container-type:inline-size;--b:clamp(36px,12.4cqw,60px)}
.cvj-block{width:var(--b);height:calc(var(--b)*.9);border-radius:26%;border:0;padding:0;cursor:pointer;transition:transform .08s}
.cvj-block:disabled{cursor:default}
.cvj-slot{width:calc(var(--b) + 6px);height:calc(var(--b) + 8px);border-radius:24%;background:rgba(0,0,0,.32);border:2px dashed rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 3px 6px rgba(0,0,0,.45)}
.cvj-btn{height:36px;min-width:36px;padding:0 6px;border-radius:12px;background:rgba(255,255,255,.92);box-shadow:0 3px 0 rgba(0,0,0,.28);font-size:15px;color:#1f3b2e}
.cvj-btn:active{transform:translateY(2px)}
@keyframes cvj-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cvj-shake{animation:cvj-shake .12s linear 3}
@keyframes cvj-pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.cvj-banner{animation:cvj-pop .35s ease-out both}
@keyframes cvj-pulse{50%{opacity:.35}}
.cvj-pulse{animation:cvj-pulse 1s infinite}
@keyframes cvj-fall{to{top:108%;transform:rotate(720deg) translateX(30px)}}
.cvj-confetti{animation:cvj-fall linear infinite}
</style>
</head>
<body>
<div id="root"></div>
<script src="REACT"></script>
<script src="REACTDOM"></script>
<script src="THREE"></script>
<script>
/*APP*/
</script>
</body>
</html>
